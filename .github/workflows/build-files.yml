name: Build files.json

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AcWingPopular.html'
      - 'build-files.js'
      - '.github/workflows/build-files.yml'
      - '!AcWingsPopular/files.json'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AcWingPopular repository
        uses: actions/checkout@v4
        with:
          repository: lkjy-coding/AcWingPopular
          path: AcWingPopular-source
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate files.json
        run: node build-files.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AcWingsPopular/files.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交。"
          else
            git commit -m "chore: 自动更新 files.json [skip ci]"
            git pull --rebase origin main
            git push
          fi
