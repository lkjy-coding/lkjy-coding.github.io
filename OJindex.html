<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OJ运营模拟器 · 简易版</title>
	<style>
		* {
			box-sizing: border-box;
			font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
		}
		body {
			background: linear-gradient(145deg, #f5f7fa 0%, #e9ecf0 100%);
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 16px;
		}
		.simulator-card {
			max-width: 1000px;
			width: 100%;
			background: rgba(255,255,255,0.75);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border-radius: 48px;
			box-shadow: 0 20px 40px rgba(0,20,40,0.2), 0 8px 16px rgba(0,0,0,0.1);
			padding: 32px 36px;
			border: 1px solid rgba(255,255,255,0.5);
		}
		h1 {
			font-size: 2.4rem;
			font-weight: 600;
			margin: 0 0 8px 0;
			background: linear-gradient(135deg, #1e2b4f, #2c3e6e);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			letter-spacing: -0.5px;
		}
		.subhead {
			font-size: 1.1rem;
			color: #2c3e50;
			margin-bottom: 32px;
			border-left: 5px solid #4a6fa5;
			padding-left: 18px;
			background: #ffffffb0;
			border-radius: 0 20px 20px 0;
			line-height: 1.5;
		}
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 20px;
			margin-bottom: 40px;
		}
		.stat-card {
			background: white;
			border-radius: 28px;
			padding: 22px 18px;
			box-shadow: 0 6px 14px rgba(0,0,0,0.04);
			border: 1px solid rgba(255,255,255,0.8);
			transition: all 0.2s;
		}
		.stat-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 14px 24px rgba(46, 74, 114, 0.15);
		}
		.stat-label {
			font-size: 0.9rem;
			text-transform: uppercase;
			letter-spacing: 1px;
			font-weight: 500;
			color: #4e6e8e;
			margin-bottom: 8px;
		}
		.stat-value {
			font-size: 2.8rem;
			font-weight: 700;
			color: #1e2f4b;
			line-height: 1.1;
		}
		.stat-unit {
			font-size: 1rem;
			font-weight: 400;
			color: #7f8c8d;
			margin-left: 4px;
		}
		.stat-trend {
			font-size: 0.9rem;
			margin-top: 8px;
			color: #27ae60;
			display: flex;
			align-items: center;
			gap: 4px;
		}
		.action-panel {
			background: #ffffffd6;
			border-radius: 36px;
			padding: 28px 30px;
			margin-bottom: 36px;
			border: 1px solid white;
			box-shadow: 0 8px 18px rgba(0,20,40,0.06);
		}
		.action-title {
			font-size: 1.5rem;
			font-weight: 600;
			color: #1a2639;
			margin: 0 0 18px 0;
		}
		.button-group {
			display: flex;
			flex-wrap: wrap;
			gap: 16px;
			margin-bottom: 24px;
		}
		.oj-btn {
			background: white;
			border: 1.5px solid #cfddee;
			padding: 14px 28px;
			border-radius: 60px;
			font-size: 1.1rem;
			font-weight: 600;
			color: #1e3a5f;
			cursor: pointer;
			transition: all 0.15s;
			box-shadow: 0 2px 6px rgba(0,0,0,0.02);
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}
		.oj-btn:hover {
			background: #e6effa;
			border-color: #7e9ec0;
			transform: scale(1.02);
			box-shadow: 0 8px 14px rgba(45, 90, 140, 0.15);
		}
		.oj-btn.primary {
			background: #1e3a5f;
			border-color: #1e3a5f;
			color: white;
		}
		.oj-btn.primary:hover {
			background: #143049;
		}
		.slider-control {
			display: flex;
			align-items: center;
			gap: 20px;
			flex-wrap: wrap;
			background: #f0f5fd;
			padding: 18px 20px;
			border-radius: 48px;
		}
		.slider-label {
			font-weight: 600;
			color: #1e3a5f;
			min-width: 130px;
		}
		input[type=range] {
			flex: 1;
			min-width: 240px;
			height: 8px;
			background: #cbd6e4;
			border-radius: 10px;
			-webkit-appearance: none;
		}
		input[type=range]::-webkit-slider-thumb {
			-webkit-appearance: none;
			width: 24px;
			height: 24px;
			background: #1e3a5f;
			border-radius: 50%;
			cursor: pointer;
			box-shadow: 0 2px 10px #1e3a5f80;
			border: 3px solid white;
		}
		.log-section {
			background: #1e2633;
			border-radius: 28px;
			padding: 22px 26px;
			color: #bdc9db;
		}
		.log-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 18px;
			font-weight: 600;
			color: #ecf0f3;
			letter-spacing: 0.5px;
		}
		.log-clear {
			background: none;
			border: 1px solid #4a5d74;
			color: #ccddee;
			padding: 6px 18px;
			border-radius: 40px;
			cursor: pointer;
			font-size: 0.85rem;
			transition: 0.1s;
		}
		.log-clear:hover {
			background: #2f3e55;
			color: white;
		}
		.log-container {
			max-height: 160px;
			overflow-y: auto;
			font-family: 'JetBrains Mono', 'Fira Code', monospace;
			font-size: 0.9rem;
			line-height: 1.6;
			padding-right: 10px;
		}
		.log-entry {
			padding: 6px 0;
			border-bottom: 1px solid #334152;
			color: #b0c4de;
		}
		.log-time {
			color: #8aa1b9;
			margin-right: 12px;
		}
		.footer-note {
			text-align: center;
			margin-top: 22px;
			color: #596f88;
			font-size: 0.9rem;
		}
		.footer-note a {
			color: #1e3a5f;
			text-decoration: none;
			font-weight: 500;
		}
	</style>
</head>
<body>
<div class="simulator-card">
	<h1>⚡ OJ 运营模拟器</h1>
	<div class="subhead">在线评测系统 · 轻量经营版 —— 调整策略，观察指标变化</div>

	<!-- 统计仪表盘 -->
	<div class="stats-grid" id="statsPanel">
		<div class="stat-card">
			<div class="stat-label">📋 总题目</div>
			<div class="stat-value" id="problemCount">24</div>
		</div>
		<div class="stat-card">
			<div class="stat-label">👥 活跃用户</div>
			<div class="stat-value" id="userCount">158</div>
			<div class="stat-unit">人</div>
		</div>
		<div class="stat-card">
			<div class="stat-label">📮 总提交</div>
			<div class="stat-value" id="submissionCount">2.4k</div>
		</div>
		<div class="stat-card">
			<div class="stat-label">✅ 通过率</div>
			<div class="stat-value" id="acceptRate">67<span class="stat-unit">%</span></div>
		</div>
	</div>

	<!-- 操作区 -->
	<div class="action-panel">
		<div class="action-title">🔧 今日运营操作</div>
		<div class="button-group">
			<button class="oj-btn" id="addProblemBtn">➕ 添加题目</button>
			<button class="oj-btn" id="newUserBtn">🎉 新用户注册</button>
			<button class="oj-btn" id="submitCodeBtn">🚀 模拟提交代码</button>
			<button class="oj-btn primary" id="nextDayBtn">⏩ 推进一天 (批量提交)</button>
		</div>
		<div class="slider-control">
			<span class="slider-label">⚙️ 难度系数 (影响通过率)</span>
			<input type="range" id="difficultySlider" min="1" max="100" value="42">
			<span id="difficultyValue" style="font-weight:600; min-width:45px;">42%</span>
		</div>
	</div>

	<!-- 事件日志 -->
	<div class="log-section">
		<div class="log-header">
			<span>📋 运营日志</span>
			<button class="log-clear" id="clearLogBtn">清除日志</button>
		</div>
		<div class="log-container" id="logContainer">
			<div class="log-entry"><span class="log-time">[09:42]</span> 模拟器已启动，当前难度42%</div>
			<div class="log-entry"><span class="log-time">[09:42]</span> 欢迎运营 OJ ~ 点击按钮开始模拟</div>
		</div>
	</div>
	<div class="footer-note">
		🧪 简易模拟 · 数据自动演算 | 项目已就绪，可部署在 <a href="#" target="_blank">lkjy-coding.github.io</a>
	</div>
</div>

<script>
	(function() {
		// --- 初始状态 ---
		let problems = 24;             // 题目总数
		let users = 158;               // 活跃用户数
		let submissions = 2417;        // 总提交次数 (用于计算k显示)
		let accepts = 1620;             // 总通过次数 (通过率 = accepts/submissions)

		// 难度系数 0-100, 数字越大通过率越低 (模拟题目变难)
		let difficulty = 42;   // 初始对应滑块42

		// 辅助函数：格式化数字 (大于1000显示 k)
		function formatNumber(num) {
			if (num >= 1000) {
				return (num / 1000).toFixed(1) + 'k';
			}
			return num.toString();
		}

		// 更新界面上所有统计数值
		function updateStatsUI() {
			document.getElementById('problemCount').innerText = problems;

			// 活跃用户显示原数 (不转k，因为通常几百人)
			document.getElementById('userCount').innerText = users;

			// 总提交 格式化为 k
			document.getElementById('submissionCount').innerText = formatNumber(submissions);

			// 通过率 = accepts / submissions ，显示整数百分比 (避开除以零)
			let rate = (submissions > 0) ? Math.round((accepts / submissions) * 100) : 100;
			document.getElementById('acceptRate').innerHTML = rate + '<span class="stat-unit">%</span>';
		}

		// 添加一条日志 (自动带时间)
		function addLog(message) {
			const logContainer = document.getElementById('logContainer');
			const now = new Date();
			const timeStr = `[${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}]`;
			const entry = document.createElement('div');
			entry.className = 'log-entry';
			entry.innerHTML = `<span class="log-time">${timeStr}</span> ${message}`;
			logContainer.appendChild(entry);
			// 自动滚动到底部
			logContainer.scrollTop = logContainer.scrollHeight;
			// 保留最多30条日志，防止太长
			if (logContainer.children.length > 30) {
				logContainer.removeChild(logContainer.children[0]);
			}
		}

		// 根据难度计算一次提交是否通过 (难度值0-100, 数值越大越难过)
		function isAcceptedByDifficulty() {
			// 难度 0  => 通过率 95%  (简单)
			// 难度 100 => 通过率 25%  (极难)
			// 线性映射: 通过率 = 0.95 - (difficulty/100)*0.7  保证在0.25~0.95之间
			let basePass = 0.95 - (difficulty / 100) * 0.7;
			if (basePass < 0.25) basePass = 0.25;
			return Math.random() < basePass;
		}

		// 批量提交 (由“推进一天”调用)
		function batchSubmit(count = 12) {
			let newSubmits = 0;
			let newAccepts = 0;
			for (let i = 0; i < count; i++) {
				newSubmits++;
				if (isAcceptedByDifficulty()) {
					newAccepts++;
				}
			}
			submissions += newSubmits;
			accepts += newAccepts;
			updateStatsUI();
			addLog(`⏳ 批量提交 ${newSubmits} 次，通过 ${newAccepts} 次 (难度 ${difficulty}%)`);
		}

		// ---- 事件绑定 ----
		document.addEventListener('DOMContentLoaded', function() {
			const addProblemBtn = document.getElementById('addProblemBtn');
			const newUserBtn = document.getElementById('newUserBtn');
			const submitCodeBtn = document.getElementById('submitCodeBtn');
			const nextDayBtn = document.getElementById('nextDayBtn');
			const difficultySlider = document.getElementById('difficultySlider');
			const difficultySpan = document.getElementById('difficultyValue');
			const clearLogBtn = document.getElementById('clearLogBtn');

			// 更新难度显示
			function updateDifficultyLabel() {
				difficulty = parseInt(difficultySlider.value, 10);
				difficultySpan.innerText = difficulty + '%';
			}

			difficultySlider.addEventListener('input', function() {
				updateDifficultyLabel();
				addLog(`⚡ 难度系数调整为 ${difficulty}%`);
			});

			// 添加题目
			addProblemBtn.addEventListener('click', function() {
				problems += 1;
				updateStatsUI();
				addLog(`📚 管理员添加了一道新题，现在共 ${problems} 题`);
			});

			// 新用户注册
			newUserBtn.addEventListener('click', function() {
				users += 1;
				updateStatsUI();
				addLog(`👤 新用户加入了 OJ，活跃用户达到 ${users} 人`);
			});

			// 模拟一次提交
			submitCodeBtn.addEventListener('click', function() {
				submissions += 1;
				let accepted = isAcceptedByDifficulty();
				if (accepted) {
					accepts += 1;
					addLog(`✅ 用户提交代码，评测通过 (难度 ${difficulty}%)`);
				} else {
					addLog(`❌ 用户提交代码，未通过 (难度 ${difficulty}%)`);
				}
				updateStatsUI();
			});

			// 推进一天 (12次提交 + 一些随机事件)
			nextDayBtn.addEventListener('click', function() {
				// 批量提交 8~15 次
				let submitCount = Math.floor(Math.random() * 8) + 8;  // 8~15
				batchSubmit(submitCount);

				// 小概率增加题目或用户
				if (Math.random() < 0.3) {  // 30% 概率加一道题
					problems += 1;
					addLog(`📌 新题目贡献者发布了一道题，现在共 ${problems} 题`);
				}
				if (Math.random() < 0.4) {  // 40% 概率新用户注册
					let newUsers = Math.floor(Math.random() * 3) + 1;  // 1~3
					users += newUsers;
					addLog(`🚀 一天内有 ${newUsers} 位新用户注册`);
				}
				updateStatsUI();
			});

			// 清除日志
			clearLogBtn.addEventListener('click', function() {
				const container = document.getElementById('logContainer');
				container.innerHTML = '';  // 清空
				addLog('🧹 日志已清空，重新开始记录');
			});

			// 初始化更新
			updateStatsUI();
			updateDifficultyLabel();

			// 随机开场日志
			addLog('✨ 一切就绪，开始运营你的OJ吧！');
		});
	})();
</script>
</body>
</html>
