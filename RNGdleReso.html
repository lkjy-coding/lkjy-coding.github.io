<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNGdle 模拟器 · 站点关停</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #0b0d10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #e8ecf1;
        }
        .container { max-width: 720px; width: 100%; text-align: center; }

        .logo h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f5e68b, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
        }

        .status-card {
            background: #14181f;
            border: 1px solid #2a303a;
            border-radius: 28px;
            padding: 3rem 2rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
            position: relative;
            overflow: hidden;
        }
        .status-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                #d45a5a, #b0b8c0, #6fbf7a, #4d8fd4,
                #a77bdb, #e6c351, #e072a8);
        }

        .status-icon {
            font-size: 3.6rem;
            color: #6f7a88;
            margin-bottom: 1.4rem;
        }
        .status-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f0f4fa;
            margin-bottom: 1.5rem;
        }
        .status-desc {
            font-size: 1rem;
            line-height: 2;
            color: #a8b0ba;
            max-width: 520px;
            margin: 0 auto;
        }
        .status-desc strong {
            color: #d4af37;
            font-weight: 600;
        }
        .disclaimer {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: #5b6573;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🎲 RNGdle 模拟器</h1>
        </div>

        <div class="status-card">
            <div class="status-icon"><i class="fas fa-ban"></i></div>
            <div class="status-title">站点关停</div>
            <div class="status-desc">
                本站因为严重技术问题，现已关停站点并不再提供服务。<br>
                本站日后不会再得到任何更新和维护。
            </div>
            <div class="disclaimer">
                本页面为本模拟器项目的关停声明，与 rngdle.com 官方无关。
            </div>
        </div>
    </div>
</body>
</html>
