<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcWing 热门内容集合站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f7fa;
    color: #24292f;
    line-height: 1.6;
    padding: 2rem 1rem;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
  .meta { color: #57606a; font-size: 0.9rem; margin-bottom: 2rem; }
  .loading { text-align: center; color: #57606a; padding: 3rem 0; }
  .error-box {
    background: #fff0f0; border: 1px solid #d1242f;
    border-left: 4px solid #d1242f; color: #d1242f;
    padding: 1rem; border-radius: 6px; margin: 2rem 0;
  }
  .group { margin-bottom: 2.5rem; }
  .group h2 {
    font-size: 1.1rem; color: #57606a;
    border-bottom: 1px solid #d0d7de;
    padding-bottom: 0.4rem; margin-bottom: 1rem;
  }
  .file-list { list-style: none; }
  .file-list li {
    background: #fff; border: 1px solid #e1e4e8;
    border-radius: 6px; padding: 0.75rem 1rem;
    margin-bottom: 0.5rem; transition: border-color 0.15s;
  }
  .file-list li:hover { border-color: #0969da; }
  .file-list a {
    color: #0969da; text-decoration: none;
    font-weight: 600; word-break: break-all;
  }
  .file-list a:hover { text-decoration: underline; }
  .file-desc { color: #57606a; font-size: 0.85rem; margin-top: 0.2rem; }
  .tag {
    display: inline-block; background: #ddf4ff; color: #0969da;
    font-size: 0.75rem; padding: 0.1rem 0.5rem;
    border-radius: 10px; margin-left: 0.5rem; vertical-align: middle;
  }
</style>
</head>
<body>
<div class="container">
  <h1>AcWing 热门内容集合站</h1>
  <div class="meta" id="meta">加载中...</div>
  <div id="app">
    <div class="loading">正在加载文件列表...</div>
  </div>
</div>

<script>
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const GROUP_NAMES = { html: '页面', image: '图片', other: '其他文件' };

// 注意文件夹名是 AcWingsPopular（多个 s）
const FILES_URL = 'https://lkjy-coding.github.io/AcWingsPopular/files.json';

function render(data) {
  const app = document.getElementById('app');
  const meta = document.getElementById('meta');

  if (!data || !Array.isArray(data.files)) {
    meta.textContent = '';
    app.innerHTML = '<div class="error-box">files.json 格式错误：缺少 files 数组。</div>';
    return;
  }

  meta.textContent = `共 ${data.total} 个文件` +
    (data.generatedAt ? ` · 更新于 ${new Date(data.generatedAt).toLocaleString('zh-CN')}` : '');

  const groups = { html: [], image: [], other: [] };
  data.files.forEach(f => {
    const type = groups[f.type] ? f.type : 'other';
    groups[type].push(f);
  });

  let html = '';
  ['html', 'image', 'other'].forEach(type => {
    const list = groups[type];
    if (!list.length) return;
    html += `<div class="group"><h2>${GROUP_NAMES[type]}</h2><ul class="file-list">`;
    list.forEach(f => {
      const safeName = escapeHtml(f.name);
      const safeDesc = escapeHtml(f.desc);
      const safeTag = escapeHtml(f.tag);
      const href = 'https://lkjy-coding.github.io/AcWingPopular/' + encodeURI(f.path);
      html += `<li>`;
      html += `<a href="${href}">${safeName}</a>`;
      if (safeTag) html += `<span class="tag">${safeTag}</span>`;
      if (safeDesc) html += `<div class="file-desc">${safeDesc}</div>`;
      html += `</li>`;
    });
    html += `</ul></div>`;
  });

  if (!html) html = '<div class="loading">目录为空。</div>';
  app.innerHTML = html;
}

function showError(msg) {
  document.getElementById('meta').textContent = '';
  document.getElementById('app').innerHTML =
    `<div class="error-box">加载失败：<pre style="white-space:pre-wrap;margin-top:0.5rem;">${escapeHtml(msg)}</pre></div>`;
}

fetch(FILES_URL)
  .then(res => {
    console.log('[files.json] status:', res.status);
    console.log('[files.json] url:', res.url);
    if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.url}`);
    return res.json();
  })
  .then(data => {
    console.log('[files.json] 加载成功，共', data.total, '个文件');
    render(data);
  })
  .catch(err => {
    console.error('[files.json] 加载失败:', err);
    showError(
      err.message +
      '\n请求地址：' + FILES_URL +
      '\n请检查：1) files.json 是否可访问 2) 路径大小写 3) 浏览器控制台完整日志'
    );
  });
</script>
</body>
</html>
