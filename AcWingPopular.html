<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcWing 热门内容集合站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #0969da;
    --primary-bg: #ddf4ff;
    --text: #1f2328;
    --text-secondary: #57606a;
    --border: #d0d7de;
    --bg: #fff;
    --sidebar-active: #ddf4ff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
  }

  /* ===== 顶部导航 ===== */
  .topbar {
    display: flex;
    align-items: center;
    height: 60px;
    padding: 0 1rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 100;
    gap: 0.75rem;
  }
  .menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--text);
    padding: 0.25rem 0.5rem;
  }
  .topbar-logo {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--text);
    white-space: nowrap;
  }
  .search-wrap {
    margin-left: auto;
    position: relative;
    width: 260px;
  }
  .topbar-search {
    width: 100%;
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
  }
  .topbar-search:focus { border-color: var(--primary); }
  .search-results {
    display: none;
    position: absolute;
    top: 110%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 320px;
    overflow-y: auto;
    z-index: 200;
  }
  .search-results.show { display: block; }
  .search-result-item {
    display: block;
    padding: 0.5rem 0.8rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid #f0f3f6;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #f0f3f6; }
  .search-result-item .path {
    display: block;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }
  .search-empty {
    padding: 0.8rem;
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-align: center;
  }

  /* ===== 布局 ===== */
  .layout {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 150;
  }
  .overlay.show { display: block; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    padding: 1.5rem 1rem;
    border-right: 1px solid #eaeef2;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    background: #fff;
  }
  .sidebar-item {
    display: block;
    padding: 0.4rem 0.75rem;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.9rem;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-item:hover { background: #f0f3f6; color: var(--text); }
  .sidebar-item.active { background: var(--sidebar-active); color: var(--primary); font-weight: 600; }
  .sidebar-folder {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-secondary);
    padding: 0.4rem 0.75rem;
    cursor: pointer;
  }
  .sidebar-children { padding-left: 0.75rem; }
  .sidebar-error {
    padding: 1rem;
    font-size: 0.85rem;
    color: #a40e26;
  }
  .retry-btn {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.3rem 0.8rem;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  /* ===== 主内容 ===== */
  .main {
    flex: 1;
    min-width: 0;
    padding: 2rem 3rem;
    max-width: 760px;
  }
  .breadcrumb {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
  }
  .breadcrumb a { color: var(--primary); text-decoration: none; }

  /* ===== 右侧目录 ===== */
  .toc {
    width: 200px;
    flex-shrink: 0;
    padding: 2rem 1rem;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    font-size: 0.85rem;
  }
  .toc a {
    display: block;
    padding: 0.2rem 0;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .toc a:hover { color: var(--primary); }

  /* ===== 文章正文 ===== */
  .article h1 { font-size: 2rem; margin: 0 0 1.5rem; }
  .article h2 { font-size: 1.5rem; margin: 2rem 0 1rem; }
  .article h3 { font-size: 1.15rem; margin: 1.5rem 0 0.75rem; }
  .article p { margin-bottom: 1rem; }
  .article a { color: var(--primary); }
  .article code {
    background: #f6f8fa; padding: 0.15rem 0.4rem;
    border-radius: 4px; font-size: 0.9em;
  }
  .article pre {
    background: #f6f8fa; padding: 1rem; border-radius: 6px;
    overflow-x: auto; margin-bottom: 1rem;
  }
  .article pre code { background: none; padding: 0; }
  .article ul, .article ol { margin: 0 0 1rem 1.5rem; }

  /* ===== 自定义框 ===== */
  .box { padding: 0.75rem 1rem; border-radius: 6px; margin: 1rem 0; border-left: 4px solid; }
  .box-title { font-weight: 700; display: block; margin-bottom: 0.25rem; }
  .box-error { background: #fff0f0; border-color: #d1242f; color: #a40e26; }
  .box-warning { background: #fff8e5; border-color: #d4a72c; color: #7d5b00; }
  .box-correct { background: #f0fff4; border-color: #1a7f37; color: #116329; }
  .box-pro { background: #f8f0ff; border-color: #8250df; color: #5a1eaa; }
  .box-needfix { background: #fff4e5; border-color: #bc4c00; color: #953800; }
  .box-predelete { background: #fff0f0; border-color: #d1242f; color: #a40e26; }
  .box-repre { background: #fff8e5; border-color: #d4a72c; color: #7d5b00; }
  .box-contribution { background: #e8f4ff; border-color: #54aeff; color: #0969da; }

  /* ===== 行内标注 ===== */
  .mark-nedfix { color: #bc4c00; font-size: 0.75em; vertical-align: super; }
  .mark-num {
    background: #eaeef2; color: var(--text); font-size: 0.75em;
    padding: 0.05rem 0.3rem; border-radius: 3px; vertical-align: super;
  }

  /* ===== 错误/重试 ===== */
  .error-page { text-align: center; padding: 3rem 0; color: var(--text-secondary); }
  .error-page h2 { color: #d1242f; margin-bottom: 1rem; font-size: 1.2rem; }
  .error-page ol {
    text-align: left;
    display: inline-block;
    margin-top: 0.5rem;
    padding-left: 1.5rem;
  }
  .error-page ol li { margin-bottom: 0.3rem; }

  /* ===== 响应式：手机端 ===== */
  @media (max-width: 1000px) {
    .toc { display: none; }
    .menu-btn { display: block; }
    .search-wrap { width: 100%; max-width: none; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 80%;
      max-width: 320px;
      height: 100vh;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      padding-top: 1.5rem;
    }
    .sidebar.open { transform: translateX(0); }

    .main {
      padding: 1.5rem 1rem;
      max-width: 100%;
    }

    .sidebar-close {
      display: block;
      text-align: right;
      font-size: 1.4rem;
      padding: 0 0.5rem 1rem;
      cursor: pointer;
      color: var(--text-secondary);
    }
  }

  @media (min-width: 1001px) {
    .sidebar-close { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
  <div class="topbar-logo">AcWing 热门内容</div>
  <div class="search-wrap">
    <input type="text" class="topbar-search" id="searchBox" placeholder="搜索条目..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-close" id="sidebarClose">✕</div>
    <div id="sidebarContent">
      <div class="sidebar-error">正在加载...</div>
    </div>
  </aside>

  <main class="main">
    <div class="breadcrumb" id="breadcrumb"></div>
    <article class="article" id="content">
      <div class="error-page">正在加载...</div>
    </article>
  </main>

  <aside class="toc" id="toc"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ============ 配置 ============
const SITE_BASE = 'https://lkjy-coding.github.io/AcWingsPopular/';
const FILES_URL = SITE_BASE + 'files.json';
const RAW_BASE = 'https://cdn.jsdelivr.net/gh/lkjy-coding/AcWingPopular@main/';
const DEFAULT_PAGE = 'index.md';

let allFiles = [];

// ============ 工具 ============
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ============ 加载 files.json ============
function loadFiles() {
  const box = document.getElementById('sidebarContent');
  box.innerHTML = '<div class="sidebar-error">正在加载目录...</div>';

  fetch(FILES_URL)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      allFiles = data.files || [];
      buildSidebar();
      route();
      window.addEventListener('hashchange', route);
    })
    .catch(err => {
      box.innerHTML =
        `<div class="sidebar-error">目录加载失败：${escapeHtml(err.message)}` +
        `<br><button class="retry-btn" onclick="loadFiles()">重试</button></div>`;
    });
}

// ============ 构建侧边栏 ============
function buildSidebar() {
  const tree = {};
  allFiles.forEach(f => {
    const parts = f.path.split('/');
    let node = tree;
    parts.forEach((part, i) => {
      if (i === parts.length - 1) {
        node['__file__' + part] = f;
      } else {
        if (!node[part]) node[part] = {};
        node = node[part];
      }
    });
  });

  const container = document.getElementById('sidebarContent');
  container.innerHTML = '';
  renderTree(tree, container);
}

function renderTree(node, container) {
  Object.keys(node).filter(k => !k.startsWith('__file__')).forEach(key => {
    const folder = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'sidebar-folder';
    title.textContent = '▸ ' + key;
    folder.appendChild(title);
    const children = document.createElement('div');
    children.className = 'sidebar-children';
    renderTree(node[key], children);
    folder.appendChild(children);
    container.appendChild(folder);
  });

  Object.keys(node).filter(k => k.startsWith('__file__')).forEach(key => {
    const f = node[key];
    const a = document.createElement('a');
    a.className = 'sidebar-item';
    a.textContent = f.title;
    a.href = '#' + encodeURIComponent(f.path);
    a.dataset.path = f.path;
    a.onclick = closeDrawer;
    container.appendChild(a);
  });
}

// ============ 搜索（下拉弹窗）============
const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');

searchBox.addEventListener('input', () => {
  const kw = searchBox.value.trim().toLowerCase();
  if (!kw) {
    searchResults.classList.remove('show');
    searchResults.innerHTML = '';
    return;
  }
  const matches = allFiles.filter(f =>
    f.title.toLowerCase().includes(kw) || f.path.toLowerCase().includes(kw)
  );
  if (!matches.length) {
    searchResults.innerHTML = '<div class="search-empty">没有匹配的条目</div>';
  } else {
    searchResults.innerHTML = matches.map(f =>
      `<a class="search-result-item" href="#${encodeURIComponent(f.path)}" onclick="closeDrawer()">
        ${escapeHtml(f.title)}
        <span class="path">${escapeHtml(f.path)}</span>
      </a>`
    ).join('');
  }
  searchResults.classList.add('show');
});

searchResults.addEventListener('click', () => {
  searchResults.classList.remove('show');
  searchBox.value = '';
});

document.addEventListener('click', (e) => {
  if (!searchBox.contains(e.target) && !searchResults.contains(e.target)) {
    searchResults.classList.remove('show');
  }
});

// ============ 路由 ============
function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  loadPage(hash || DEFAULT_PAGE);
}

// ============ 加载页面 ============
async function loadPage(path) {
  document.querySelectorAll('.sidebar-item').forEach(a => {
    a.classList.toggle('active', a.dataset.path === path);
  });

  const fileEntry = allFiles.find(f => f.path === path);
  document.getElementById('breadcrumb').innerHTML =
    `<a href="#index.md">首页</a>` + (fileEntry ? ` &gt; ${escapeHtml(fileEntry.title)}` : '');

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="error-page">正在加载...</div>';

  try {
    const res = await fetch(RAW_BASE + path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    let raw = await res.text();
    raw = processCustomBlocks(raw);
    let html = marked.parse(raw);
    html = processInlineMarks(html);
    contentEl.innerHTML = html;
    buildTOC();
  } catch (err) {
    // 尝试加载 error.md
    try {
      const errRes = await fetch(RAW_BASE + 'error.md');
      const errText = await errRes.text();
      contentEl.innerHTML = marked.parse(processCustomBlocks(errText));
    } catch (e2) {
      // 连 error.md 都没有 → 用内置引导页
      contentEl.innerHTML =
        `<div class="error-page">` +
        `<h2>页面不存在</h2>` +
        `<p>找不到条目：${escapeHtml(path)}</p>` +
        `<p style="margin-top:1.5rem;">请尝试：</p>` +
        `<ol>` +
        `<li>刷新一下</li>` +
        `<li>检查是否有错字漏字</li>` +
        `<li>前往 AcWing 向 lkjy 反馈问题</li>` +
        `</ol>` +
        `<div style="margin-top:1rem;"><button class="retry-btn" onclick="route()">重试</button></div>` +
        `</div>`;
    }
  }
}

// ============ 自定义块 ============
function processCustomBlocks(text) {
  const blockTypes = {
    error: 'box-error', warning: 'box-warning', correct: 'box-correct',
    pro: 'box-pro', needfix: 'box-needfix', predelete: 'box-predelete',
    repre: 'box-repre', contribution: 'box-contribution'
  };

  Object.keys(blockTypes).forEach(type => {
    const re = new RegExp(`::::${type}\\[([^\\]]*)\\]([\\s\\S]*?)::::`, 'g');
    text = text.replace(re, (m, name, body) =>
      `<div class="box ${blockTypes[type]}"><span class="box-title">${escapeHtml(name)}</span>${marked.parseInline(body.trim())}</div>`);
  });

  const noArgDefaults = {
    needfix: ['此条目仍需完善', '此条目部分内容仍需完善，你可以将你搜集到的内容提交给lkjy。'],
    predelete: ['此条目将被删除。', '此条目因为一些严重问题将会被删除。'],
    repre: ['此条目将要重写。', '此条目中的部分内容将要被重写。']
  };
  Object.keys(noArgDefaults).forEach(type => {
    const re = new RegExp(`::::${type}\\(\\)[\\s\\S]*?::::`, 'g');
    text = text.replace(re, () =>
      `<div class="box ${blockTypes[type]}"><span class="box-title">${noArgDefaults[type][0]}</span>${noArgDefaults[type][1]}</div>`);
  });

  text = text.replace(/::::contribution([\s\S]*?)::::/g, (m, ids) =>
    `<div class="box box-contribution"><span class="box-title">贡献者</span>感谢以下用户对此条目的贡献：${escapeHtml(ids.trim())}</div>`);

  return text;
}

// ============ 行内标注 ============
function processInlineMarks(html) {
  let nedfixCount = 0;
  html = html.replace(/\^\[NedFi\]/g, () => {
    nedfixCount++;
    return `<sup class="mark-nedfix">[待补充${nedfixCount}]</sup>`;
  });

  html = html.replace(/\^\[(\d+)\]/g, (m, n) =>
    `<sup class="mark-num">${n}</sup>`);

  const notes = [];
  html = html.replace(/\^\[d(\d+)\]([^\s<]*)/g, (m, n, txt) => {
    notes.push({ n: n, txt: txt });
    return '';
  });
  if (notes.length) {
    html += '<hr><div><strong>注释</strong><ul>' +
      notes.map(o => `<li>[${o.n}] ${escapeHtml(o.txt)}</li>`).join('') + '</ul></div>';
  }
  return html;
}

// ============ 右侧目录 ============
function buildTOC() {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  document.querySelectorAll('.article h2, .article h3').forEach((h, i) => {
    if (!h.id) h.id = 'heading-' + i;
    const a = document.createElement('a');
    a.textContent = h.textContent;
    a.href = '#' + h.id;
    a.onclick = (e) => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); };
    toc.appendChild(a);
  });
}

// ============ 手机端抽屉 ============
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

document.getElementById('menuBtn').addEventListener('click', () => {
  sidebar.classList.add('open');
  overlay.classList.add('show');
});
function closeDrawer() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}
overlay.addEventListener('click', closeDrawer);
document.getElementById('sidebarClose').addEventListener('click', closeDrawer);

// ============ 启动 ============
loadFiles();
</script>
</body>
</html>
